services:
  product-service:
    build: ./product-service
    ports: ["8081:8081"]
  cart-service:
    build: ./cart-service
    ports: ["8082:8082"]
  order-service:
    build: ./order-service
    ports: ["8083:8083"]
  shopkart-gateway:
    build: ./shopkart-gateway
    ports: ["8080:8080"]
    environment:
      PRODUCTS_URL: http://product-service:8081
      CART_URL: http://cart-service:8082
      ORDERS_URL: http://order-service:8083
    depends_on: [product-service, cart-service, order-service]
