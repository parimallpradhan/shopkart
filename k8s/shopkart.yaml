apiVersion: apps/v1
kind: Deployment
metadata: {name: product-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: product-service}}
  template:
    metadata: {labels: {app: product-service}}
    spec:
      containers:
      - name: product-service
        image: shopkart-product-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8081}]
---
apiVersion: v1
kind: Service
metadata: {name: product-service}
spec:
  selector: {app: product-service}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart-service}}
  template:
    metadata: {labels: {app: cart-service}}
    spec:
      containers:
      - name: cart-service
        image: shopkart-cart-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8082}]
---
apiVersion: v1
kind: Service
metadata: {name: cart-service}
spec:
  selector: {app: cart-service}
  ports: [{port: 8082, targetPort: 8082}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
      - name: order-service
        image: shopkart-order-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8083}]
---
apiVersion: v1
kind: Service
metadata: {name: order-service}
spec:
  selector: {app: order-service}
  ports: [{port: 8083, targetPort: 8083}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shopkart-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: shopkart-gateway}}
  template:
    metadata: {labels: {app: shopkart-gateway}}
    spec:
      containers:
      - name: shopkart-gateway
        image: shopkart-gateway:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        env:
        - {name: PRODUCTS_URL, value: "http://product-service:8081"}
        - {name: CART_URL, value: "http://cart-service:8082"}
        - {name: ORDERS_URL, value: "http://order-service:8083"}
---
apiVersion: v1
kind: Service
metadata: {name: shopkart-gateway}
spec:
  type: NodePort
  selector: {app: shopkart-gateway}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
